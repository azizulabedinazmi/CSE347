<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>.blk{animation:b 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.k2{animation-delay:.3s}.k3{animation-delay:.6s}.k4{animation-delay:.9s}
      @keyframes b{0%{transform:scaleX(0)}30%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}</style>
  </defs>
  <rect width="1200" height="320" fill="#ffde59"/>
  <!-- neo-brutalist browser -->
  <g transform="translate(700 34)" stroke="#111" stroke-width="4">
    <rect x="10" y="10" width="440" height="250" fill="#111"/>
    <rect width="440" height="250" fill="#fff"/>
    <rect width="440" height="40" fill="#ff5c8a"/>
    <g fill="#fff"><circle cx="22" cy="20" r="7"/><circle cx="44" cy="20" r="7"/><circle cx="66" cy="20" r="7"/></g>
    <rect x="90" y="10" width="330" height="20" fill="#fff" stroke-width="3"/>
    <text x="102" y="25" stroke="none" font-family="Consolas, Menlo, monospace" font-size="13" fill="#111">localhost/LAB 05/index.html</text>
    <rect x="20" y="58" width="120" height="120" fill="#7dd3fc"/>
    <circle cx="80" cy="102" r="22" fill="#fff" stroke-width="3"/><path d="M44 174a36 30 0 0 1 72 0" fill="#fff" stroke-width="3"/>
    <rect class="blk" x="160" y="62" width="250" height="20" fill="#111" stroke="none"/>
    <rect class="blk k2" x="160" y="94" width="190" height="14" fill="#a3a3a3" stroke="none"/>
    <rect class="blk k3" x="160" y="118" width="220" height="14" fill="#a3a3a3" stroke="none"/>
    <rect class="blk k4" x="160" y="150" width="100" height="28" fill="#4ade80" stroke-width="3"/>
    <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" stroke-width="3">
      <rect x="20" y="198" width="88" height="34" fill="#c4b5fd"/><text x="64" y="220" text-anchor="middle" stroke="none" fill="#111">INSERT</text>
      <rect x="118" y="198" width="72" height="34" fill="#7dd3fc"/><text x="154" y="220" text-anchor="middle" stroke="none" fill="#111">READ</text>
      <rect x="200" y="198" width="90" height="34" fill="#4ade80"/><text x="245" y="220" text-anchor="middle" stroke="none" fill="#111">UPDATE</text>
      <rect x="300" y="198" width="90" height="34" fill="#ff5c8a"/><text x="345" y="220" text-anchor="middle" stroke="none" fill="#111">DELETE</text>
    </g>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-weight="700">
    <rect x="62" y="56" width="210" height="40" fill="#111"/><text x="78" y="83" font-size="20" fill="#ffde59">&lt;CSE347/&gt;</text>
    <text x="58" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="70" font-weight="900" fill="#111">Web Labs</text>
    <text x="62" y="222" font-size="19" fill="#111">HTML → CV page → portfolio → PHP CRUD</text>
    <g font-size="15" stroke="#111" stroke-width="3">
      <rect x="62" y="244" width="80" height="34" fill="#fff"/><text x="102" y="267" text-anchor="middle" stroke="none" fill="#111">HTML</text>
      <rect x="152" y="244" width="70" height="34" fill="#fff"/><text x="187" y="267" text-anchor="middle" stroke="none" fill="#111">CSS</text>
      <rect x="232" y="244" width="70" height="34" fill="#fff"/><text x="267" y="267" text-anchor="middle" stroke="none" fill="#111">PHP</text>
      <rect x="312" y="244" width="86" height="34" fill="#fff"/><text x="355" y="267" text-anchor="middle" stroke="none" fill="#111">MySQL</text>
    </g>
  </g>
</svg>
